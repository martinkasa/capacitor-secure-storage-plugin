<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Blank
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Blank</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="row">
    <ion-button (click)="showPlatform()">Show platform</ion-button>
  </div>
  <div class="row">
    Key: <input type="text" [(ngModel)]="getKey" />
    <ion-button (click)="get()">Get</ion-button>
  </div>
  <div class="row">
    Key: <input type="text" [(ngModel)]="setKey" />
    Value: <input type="text" [(ngModel)]="setValue" />
    <ion-button (click)="set()">Set</ion-button>
  </div>
  <div class="row">
    Key: <input type="text" [(ngModel)]="removeKey" />
    <ion-button (click)="remove()">Remove</ion-button>
  </div>
  <div class="row">
    <ion-button (click)="keys()">All keys</ion-button>
  </div>
  <div class="row">
    <ion-button (click)="clear()">Clear</ion-button>
  </div>
</ion-content>
